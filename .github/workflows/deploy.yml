# Publica o Worker na Cloudflare: ele serve o app (www/), a API em /api/* e
# roda o cron dos lembretes. Um deploy so, e o repositorio pode ser privado
# (o GitHub Pages gratis exigiria repo publico).
#
# Antes do primeiro uso, cadastre em Settings > Secrets and variables > Actions:
#   CLOUDFLARE_API_TOKEN   token com o template "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  id da conta (painel da Cloudflare, barra lateral)
#   VAPID_PUBLIC_KEY       \ gerados com: npx web-push generate-vapid-keys
#   VAPID_PRIVATE_KEY      /
#   VAPID_SUBJECT          mailto:seu-email (o push service da Apple exige)
#   APP_TOKEN              segredo qualquer; o app pede ele uma vez em Ajustes

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  deploy:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Instalar dependencias do Worker
        working-directory: worker
        run: npm ci

      # Usa o wrangler do worker/package-lock.json. O KV STATE e criado
      # sozinho no primeiro deploy (wrangler.toml sem id, de proposito).
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            VAPID_PUBLIC_KEY
            VAPID_PRIVATE_KEY
            VAPID_SUBJECT
            APP_TOKEN
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
